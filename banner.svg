    <text x="65" y="128" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Nginx &#183; eBPF &#183; Console
    </text>
  </g>

</svg>
