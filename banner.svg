<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DoS/DDoS Attack Simulation and Real-time Defense Lab - PBL3">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <radialGradient id="glow-victim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-attack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="badge-pbl3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="laptop-screen-victim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="laptop-screen-att" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0505"/>
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.35"/>
    </pattern>

    <!-- Marker Arrows -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dot-grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="780" cy="160" r="140" fill="url(#glow-attack)"/>
  <circle cx="1060" cy="160" r="150" fill="url(#glow-victim)"/>

  <!-- Accent Top and Bottom Borders -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#bar-gradient)"/>
  <rect x="0" y="295" width="1200" height="5" fill="url(#bar-gradient)"/>

  <!-- ======================================================== -->
  <!-- LEFT SIDE: TITLE, DESCRIPTIONS & 9 FEATURES              -->
  <!-- ======================================================== -->
  <!-- Main Title -->
  <text x="68" y="98" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="900" fill="#f8fafc" letter-spacing="1.5">
    DoS <tspan fill="#ef4444">/</tspan> DDoS
  </text>

  <!-- Subtitle -->
  <text x="70" y="136" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="700" fill="#93c5fd" letter-spacing="0.5">
    Real-Time Attack Simulation &amp; Defense Lab
  </text>

  <!-- Technology Summary (No isolated docker text) -->
  <text x="70" y="168" font-family="'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    Multi-Machine WiFi/LAN Lab &#183; SYN Flood &#183; UDP Flood &#183; HTTP Flood &#183; Rule &amp; ML Hybrid
  </text>

  <!-- 9 Features Showcase Card -->
  <g transform="translate(70, 190)">
    <rect width="580" height="64" rx="10" fill="#0b1322" fill-opacity="0.85" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Header of Features Badge -->
    <text x="16" y="22" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">
      9 REAL-TIME FEATURES:
    </text>

    <!-- The 9 Metrics Listed -->
    <text x="16" y="47" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
      pps <tspan fill="#64748b">&#183;</tspan>
      syn <tspan fill="#64748b">&#183;</tspan>
      ack <tspan fill="#64748b">&#183;</tspan>
      udp <tspan fill="#64748b">&#183;</tspan>
      H(src) <tspan fill="#64748b">&#183;</tspan>
      H(dport) <tspan fill="#64748b">&#183;</tspan>
      n_src <tspan fill="#64748b">&#183;</tspan>
      syn_ratio <tspan fill="#64748b">&#183;</tspan>
      ack_syn_ratio
    </text>
  </g>

  <!-- ======================================================== -->
  <!-- TOP RIGHT: PBL3 BADGE                                    -->
  <!-- ======================================================== -->
  <g transform="translate(1040, 22)">
    <rect width="130" height="38" rx="19" fill="url(#badge-pbl3)" filter="drop-shadow(0 2px 6px rgba(239, 68, 68, 0.4))"/>
    <text x="65" y="25" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">DUT &#183; PBL3</text>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT SIDE: 2 ATTACKER LAPTOPS ATTACKING 1 VICTIM LAPTOP -->
  <!-- ======================================================== -->

  <!-- Radar waves surrounding Victim Laptop -->
  <circle cx="1060" cy="165" r="75" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.45"/>
  <circle cx="1060" cy="165" r="95" fill="none" stroke="#059669" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.25"/>

  <!-- Attack Vector 1: Attacker 1 -> Victim -->
  <path d="M 815 105 C 890 105, 940 145, 1000 155" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-red)" opacity="0.9"/>
  <!-- Attack Vector 2: Attacker 2 -> Victim -->
  <path d="M 815 225 C 890 225, 940 185, 1000 175" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrow-red)" opacity="0.9"/>

  <!-- Flow Label -->
  <g transform="translate(900, 165)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#1e1b4b" stroke="#ef4444" stroke-width="1"/>
    <text x="0" y="4" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">DDoS Flood</text>
  </g>

  <!-- ================= LAPTOP 1: ATTACKER 1 (Top) ================= -->
  <g transform="translate(740, 75)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="70" height="46" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Screen Display -->
    <rect x="4" y="4" width="62" height="38" rx="2" fill="url(#laptop-screen-att)"/>
    <!-- Attack CLI glyphs -->
    <text x="8" y="16" font-family="monospace" font-size="8" fill="#ef4444">&gt; hping3</text>
    <text x="8" y="26" font-family="monospace" font-size="7" fill="#fca5a5">--flood</text>
    <text x="8" y="36" font-family="monospace" font-size="7" fill="#fca5a5">SYN/UDP</text>
    <circle cx="56" cy="14" r="3" fill="#ef4444"/>
    <!-- Base / Keyboard -->
    <path d="M -10 46 L 80 46 L 86 53 L -16 53 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Trackpad -->
    <rect x="24" y="47" width="22" height="4" rx="1" fill="#334155"/>
    <!-- Label -->
    <text x="35" y="68" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">
      Attacker 1
    </text>
  </g>

  <!-- ================= LAPTOP 2: ATTACKER 2 (Bottom) ============== -->
  <g transform="translate(740, 195)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="70" height="46" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Screen Display -->
    <rect x="4" y="4" width="62" height="38" rx="2" fill="url(#laptop-screen-att)"/>
    <!-- Attack CLI glyphs -->
    <text x="8" y="16" font-family="monospace" font-size="8" fill="#ef4444">&gt; python3</text>
    <text x="8" y="26" font-family="monospace" font-size="7" fill="#fca5a5">http_flood</text>
    <text x="8" y="36" font-family="monospace" font-size="7" fill="#fca5a5">L7 GET</text>
    <circle cx="56" cy="14" r="3" fill="#ef4444"/>
    <!-- Base / Keyboard -->
    <path d="M -10 46 L 80 46 L 86 53 L -16 53 Z" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <!-- Trackpad -->
    <rect x="24" y="47" width="22" height="4" rx="1" fill="#334155"/>
    <!-- Label -->
    <text x="35" y="68" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">
      Attacker 2
    </text>
  </g>

  <!-- ================= LAPTOP 3: VICTIM (Target + Detector) ======= -->
  <g transform="translate(1015, 125)">
    <!-- Screen Frame -->
    <rect x="0" y="0" width="90" height="60" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="5" y="5" width="80" height="50" rx="3" fill="url(#laptop-screen-victim)"/>
    <!-- Shield / Defense Symbol -->
    <path d="M 45 14 L 60 19 L 60 31 C 60 41 45 47 45 47 C 45 47 30 41 30 31 L 30 19 Z" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="1.8"/>
    <!-- Radar Heartbeat Line -->
    <path d="M 12 36 L 25 36 L 30 30 L 35 42 L 40 33 L 45 36 L 78 36" fill="none" stroke="#6ee7b7" stroke-width="1.2" opacity="0.8"/>
    <text x="45" y="29" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#a7f3d0" text-anchor="middle">DEFENSE</text>
    <!-- Base / Keyboard -->
    <path d="M -12 60 L 102 60 L 110 69 L -20 69 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <!-- Trackpad -->
    <rect x="32" y="62" width="26" height="4" rx="1.5" fill="#334155"/>
    <!-- Labels -->
    <text x="45" y="85" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">
      Victim Server
    </text>
    <text x="45" y="99" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">
      Nginx + Detector
    </text>
  </g>

</svg>
