<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DoS/DDoS Attack Simulation and Detection Lab - PBL3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.65">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" fill-opacity="0.30"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>
  <rect x="0" y="294" width="1200" height="6" fill="url(#bar)"/>

  <!-- title -->
  <text x="72" y="150" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="1">DoS <tspan fill="#ef4444">/</tspan> DDoS</text>
  <text x="74" y="196" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="#93c5fd">Attack Simulation &amp; Detection Lab</text>
  <text x="74" y="232" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#7c8aa3">Isolated Docker lab &#183; SYN flood (L4) &#183; HTTP flood (L7) &#183; real-time detection</text>

  <!-- PBL3 badge (top-right corner) -->
  <rect x="1028" y="26" width="144" height="48" rx="24" fill="url(#badge)"/>
  <text x="1100" y="58" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">PBL3</text>

  <!-- network motif: 3 attackers -> victim (with detector ring) -->
  <g stroke="#ef4444" stroke-width="2.2" opacity="0.85" marker-end="url(#arrow)" fill="none">
    <path d="M898,160 L1044,198"/>
    <path d="M884,208 L1044,208"/>
    <path d="M898,256 L1044,218"/>
  </g>
  <g fill="#ef4444">
    <circle cx="882" cy="158" r="14"/>
    <circle cx="866" cy="208" r="14"/>
    <circle cx="882" cy="258" r="14"/>
  </g>
  <circle cx="1086" cy="208" r="41" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4 5" opacity="0.75"/>
  <circle cx="1086" cy="208" r="28" fill="#22c55e"/>
  <text x="1086" y="213" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#052e16" text-anchor="middle">victim</text>
  <text x="874" y="128" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#fca5a5" text-anchor="middle">attackers &#215;3</text>
  <text x="1086" y="272" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#86efac" text-anchor="middle">detector</text>
</svg>
