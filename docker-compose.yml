services:
  victim:
    image: nginx:alpine
    container_name: victim
    networks:
      dos-lab:
        ipv4_address: 172.30.0.10
    ports:
      - "8080:80"          # xem web từ Windows qua http://localhost:8080

  attacker1:
    build: ./attacker
    container_name: attacker1
    cap_add: [NET_RAW, NET_ADMIN]   # cần để scapy/hping3 gửi raw packet + spoof IP
    volumes:
      - ./attacks:/app  
    networks:
      dos-lab:
        ipv4_address: 172.30.0.21

  attacker2:
    build: ./attacker
    container_name: attacker2
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./attacks:/app  
    networks:
      dos-lab:
        ipv4_address: 172.30.0.22

  attacker3:
    build: ./attacker
    container_name: attacker3
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./attacks:/app
    networks:
      dos-lab:
        ipv4_address: 172.30.0.23

  attacker4:
    build: ./attacker
    container_name: attacker4
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./attacks:/app
    networks:
      dos-lab:
        ipv4_address: 172.30.0.24

  attacker5:
    build: ./attacker
    container_name: attacker5
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./attacks:/app
    networks:
      dos-lab:
        ipv4_address: 172.30.0.25

  attacker6:
    build: ./attacker
    container_name: attacker6
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./attacks:/app
    networks:
      dos-lab:
        ipv4_address: 172.30.0.26

  detector:
    build: ./detection             # image rieng co scapy + eBPF/BCC (xem detection/Dockerfile)
    container_name: detector
    # NET_ADMIN: attach XDP; BPF+PERFMON: nap chuong trinh + maps eBPF (kernel >= 5.8).
    cap_add: [NET_RAW, NET_ADMIN, BPF, PERFMON]
    network_mode: "service:victim" # dung chung mang voi victim -> sniff/XDP tren eth0 cua victim
    volumes:
      - ./detection:/app
      # BCC can kernel headers + debugfs de bien dich chuong trinh eBPF (container dung chung kernel host):
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - /sys/kernel/debug:/sys/kernel/debug
    command: ["sleep", "infinity"]

networks:
  dos-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24