// bind9 reflector cho lab DNS Amplification. CHI DUNG TRONG LAB CO LAP.
options {
    directory "/var/cache/bind";
    recursion no;              // authoritative-only: KHONG phai open resolver that su (an toan)
    allow-query { any; };      // attacker (spoof src=victim) hoi duoc -> phan hoi doi ve victim
    listen-on { any; };
    listen-on-v6 { none; };
    dnssec-validation no;
    minimal-responses no;      // tra day du record -> phan hoi lon hon (khuech dai cao hon)
    max-udp-size 4096;         // cho phep phan hoi UDP LON (khong truncate) -> khuech dai that su.
                               // Day chinh la cau hinh sai lam resolver bi lam dung DNS amplification.
    edns-udp-size 4096;
};

// Zone authoritative voi 1 TXT lon de tao he so khuech dai (xem db.amp.lab).
zone "amp.lab" {
    type master;
    file "/etc/bind/db.amp.lab";
};
