# Victim base config for the lab: a deliberately SMALL server so attacks have a
# visible effect (a real static nginx is otherwise too strong to overwhelm on a laptop).
# worker_connections is low on purpose -> a Slowloris attack can exhaust the
# connection slots and make the service unreachable for legitimate clients.
# The per-location defenses (rate-limit, header timeout) live in conf.d/default.conf,
# which the mitigation toggle / demo swaps at runtime.
user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}
