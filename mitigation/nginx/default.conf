# L7 mitigation applied to the victim's conf.d at runtime (dashboard toggle / demos).
# Defends two L7 attacks:
#   - HTTP flood  -> per-IP request + connection rate limits (excess gets 429)
#   - Slowloris   -> short header/body timeouts drop slow "held" connections, freeing slots
#
# limit_req_zone / limit_conn_zone are valid here because conf.d/*.conf is included
# inside the http{} block of nginx.conf.

limit_req_zone  $binary_remote_addr  zone=perip:10m      rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=connperip:10m;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # anti-Slowloris: drop connections that send headers/body too slowly
    client_header_timeout 5s;
    client_body_timeout   5s;
    send_timeout          10s;

    location / {
        limit_req         zone=perip burst=20 nodelay;   # anti HTTP flood
        limit_conn        connperip 10;                   # cap concurrent connections per IP
        limit_req_status  429;
        limit_conn_status 429;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
