# DDoS mitigation (L7): per-IP request + connection rate limiting.
# limit_req_zone / limit_conn_zone are valid here because conf.d/*.conf is
# included inside the http{} block of nginx.conf.
#
# - perip:      max ~10 requests/s per source IP, bursts up to 20 (excess -> 429)
# - connperip:  max 20 concurrent connections per source IP
# A legitimate client (low rate) is unaffected; a flood from one IP is capped,
# so the server spends almost no work rejecting the excess.

limit_req_zone  $binary_remote_addr  zone=perip:10m      rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=connperip:10m;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        limit_req         zone=perip burst=20 nodelay;
        limit_conn        connperip 20;
        limit_req_status  429;
        limit_conn_status 429;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}
